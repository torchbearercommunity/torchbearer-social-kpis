<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torchbearer Community — Social Media KPIs</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --muted: #71717a;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
  }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .kpi-card .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .kpi-card .value { font-size: 28px; font-weight: 700; }
  .kpi-card .change { font-size: 13px; margin-top: 4px; }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }
  .platform-icon {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .tabs { display: flex; gap: 4px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .tab:hover { border-color: var(--text); color: var(--text); }
  .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(500px, 100%), 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .chart-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 300px; }
  .table-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    overflow-x: auto;
    margin-bottom: 24px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.03); }
  .empty-note {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    color: var(--muted);
    margin-bottom: 24px;
  }
  @media (max-width: 600px) { body { padding: 12px; } }
</style>
</head>
<body>

<h1>Torchbearer Community</h1>
<p class="subtitle" id="subtitle">Weekly social media KPIs &middot; loading&hellip;</p>

<div class="tabs" id="platformTabs"></div>
<div class="kpi-row" id="kpiRow"></div>
<div class="charts-grid" id="chartsArea"></div>

<div class="table-card">
  <h3 id="tableTitle">Weekly Data</h3>
  <div style="overflow-x:auto">
    <table id="dataTable"><thead></thead><tbody></tbody></table>
  </div>
</div>

<script>
let DB = null;          // loaded kpis.json
let weekLabels = [];    // human labels derived from week-ending dates
let activePlatform = "overview";
let charts = [];

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function weekLabel(endIso) {
  const end = new Date(endIso + "T00:00:00");
  const start = new Date(end);
  start.setDate(end.getDate() - 6);
  const sm = MONTHS[start.getMonth()], em = MONTHS[end.getMonth()];
  return sm === em
    ? `${sm} ${start.getDate()}–${end.getDate()}`
    : `${sm} ${start.getDate()}–${em} ${end.getDate()}`;
}

function getValidPairs(arr) {
  const result = { labels: [], values: [] };
  arr.forEach((v, i) => {
    if (v !== null && v !== undefined) {
      result.labels.push(weekLabels[i]);
      result.values.push(v);
    }
  });
  return result;
}

function pctChange(arr) {
  const vals = arr.filter(v => v !== null);
  if (vals.length < 2) return null;
  const prev = vals[vals.length - 2];
  const curr = vals[vals.length - 1];
  if (prev === 0) return null;
  return ((curr - prev) / prev * 100).toFixed(1);
}

function latestVal(arr) {
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i] !== null) return arr[i];
  }
  return null;
}

// First metric matching any of the given name fragments (case-insensitive)
function findMetric(p, fragments) {
  const keys = Object.keys(p.metrics);
  for (const frag of fragments) {
    const k = keys.find(k => k.toLowerCase().includes(frag));
    if (k) return k;
  }
  return null;
}

const followersKey = p => findMetric(p, ["follower", "subscriber"]);
const viewsKey     = p => findMetric(p, ["impression", "views"]);
const engKey       = p => {
  const k = Object.keys(p.metrics).find(k =>
    /engagement|interaction/i.test(k) && !/rate|%/i.test(k));
  return k ?? null;
};
const rateKey      = p => Object.keys(p.metrics).find(k => /rate|ctr/i.test(k)) ?? null;

function destroyCharts() { charts.forEach(c => c.destroy()); charts = []; }

function chartOpts(showLegend) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: showLegend ? { labels: { color: '#e4e4e7', font: { size: 12 } } } : { display: false },
      tooltip: { backgroundColor:'#1a1d27', titleColor:'#e4e4e7', bodyColor:'#e4e4e7', borderColor:'#2a2d3a', borderWidth:1, padding:12 }
    },
    scales: {
      x: { ticks:{color:'#71717a', maxRotation:45, font:{size:11}}, grid:{color:'#2a2d3a'} },
      y: { ticks:{color:'#71717a', font:{size:11}}, grid:{color:'#2a2d3a'} }
    },
    spanGaps: true
  };
}

function renderTabs() {
  const container = document.getElementById("platformTabs");
  const tabs = [`<button class="tab ${activePlatform === 'overview' ? 'active' : ''}" data-platform="overview">Overview</button>`];
  for (const key of Object.keys(DB.platforms)) {
    const p = DB.platforms[key];
    tabs.push(`<button class="tab ${key === activePlatform ? 'active' : ''}" data-platform="${key}">
      <span class="platform-icon" style="background:${p.color}"></span>${p.name}</button>`);
  }
  container.innerHTML = tabs.join('');
}

/* ---------- single-platform view ---------- */

function renderPlatform(key) {
  const p = DB.platforms[key];
  const metricKeys = Object.keys(p.metrics);

  // KPI cards
  document.getElementById("kpiRow").innerHTML = metricKeys.map(mk => {
    const vals = p.metrics[mk];
    const latest = latestVal(vals);
    const change = pctChange(vals);
    const isUp = change !== null && parseFloat(change) >= 0;
    const changeHtml = change !== null
      ? `<div class="change ${isUp ? 'up' : 'down'}">${isUp ? '&#9650;' : '&#9660;'} ${Math.abs(change)}% vs prev week</div>` : '';
    const fmt = latest === null ? '—' : (mk.includes('%') ? latest + '%' : latest.toLocaleString());
    return `<div class="kpi-card">
      <div class="label"><span class="platform-icon" style="background:${p.color}"></span>${mk}</div>
      <div class="value">${fmt}</div>${changeHtml}</div>`;
  }).join('');

  // Charts (only metrics that have data)
  destroyCharts();
  const area = document.getElementById("chartsArea");
  const withData = metricKeys.filter(mk => p.metrics[mk].some(v => v !== null));
  if (!withData.length) {
    area.innerHTML = `<div class="empty-note">No data collected yet for ${p.name}. It will appear here after the next weekly collection.</div>`;
  } else {
    area.innerHTML = withData.map((_, i) => `
      <div class="chart-card"><h3 id="chartTitle${i}"></h3>
        <div class="chart-wrap"><canvas id="chart${i}"></canvas></div></div>`).join('');
    withData.forEach((mk, i) => {
      document.getElementById(`chartTitle${i}`).textContent = mk;
      const pairs = getValidPairs(p.metrics[mk]);
      const ctx = document.getElementById(`chart${i}`).getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 300);
      gradient.addColorStop(0, p.color + '33');
      gradient.addColorStop(1, p.color + '00');
      charts.push(new Chart(ctx, {
        type: 'line',
        data: { labels: pairs.labels, datasets: [{
          label: mk, data: pairs.values, borderColor: p.color, backgroundColor: gradient,
          fill: true, tension: 0.3, pointRadius: 3, pointHoverRadius: 6, borderWidth: 2 }] },
        options: chartOpts(false)
      }));
    });
  }

  // Table, newest first
  document.getElementById("tableTitle").textContent = p.name + " — Weekly Data";
  const thead = document.querySelector("#dataTable thead");
  const tbody = document.querySelector("#dataTable tbody");
  thead.innerHTML = `<tr><th>Week</th>${metricKeys.map(k => `<th>${k}</th>`).join('')}</tr>`;
  const rows = [];
  for (let i = DB.weeks.length - 1; i >= 0; i--) {
    if (!metricKeys.some(k => p.metrics[k][i] !== null)) continue;
    rows.push(`<tr><td>${weekLabels[i]}</td>${metricKeys.map(k => {
      const v = p.metrics[k][i];
      if (v === null) return '<td style="color:#71717a">—</td>';
      return `<td>${k.includes('%') ? v + '%' : v.toLocaleString()}</td>`;
    }).join('')}</tr>`);
  }
  tbody.innerHTML = rows.length ? rows.join('') : `<tr><td colspan="${metricKeys.length + 1}" style="color:#71717a">No data yet</td></tr>`;
}

/* ---------- overview ---------- */

function alignDatasetTo(ds, labels) {
  const map = {};
  ds._labels.forEach((l, i) => map[l] = ds.data[i]);
  return { ...ds, data: labels.map(l => map[l] ?? null), _labels: undefined };
}

function multiPlatformChart(canvasId, keyFn, type = 'line') {
  const sets = [];
  for (const [key, p] of Object.entries(DB.platforms)) {
    const mk = keyFn(p);
    if (!mk || !p.metrics[mk].some(v => v !== null)) continue;
    const pairs = getValidPairs(p.metrics[mk]);
    sets.push({ label: p.name, data: pairs.values, _labels: pairs.labels,
      borderColor: p.color, backgroundColor: type === 'bar' ? p.color + 'cc' : p.color + '22',
      tension: 0.3, pointRadius: 2, borderWidth: 2, fill: false });
  }
  if (!sets.length) return null;
  const labels = [...new Set(sets.flatMap(d => d._labels))];
  labels.sort((a, b) => weekLabels.indexOf(a) - weekLabels.indexOf(b));
  return new Chart(document.getElementById(canvasId), {
    type, data: { labels, datasets: sets.map(ds => alignDatasetTo(ds, labels)) },
    options: chartOpts(true)
  });
}

function renderOverview() {
  // KPI cards: latest followers per platform
  document.getElementById("kpiRow").innerHTML = Object.entries(DB.platforms).map(([key, p]) => {
    const fk = followersKey(p);
    const fol = fk ? latestVal(p.metrics[fk]) : null;
    const ch = fk ? pctChange(p.metrics[fk]) : null;
    const isUp = ch !== null && parseFloat(ch) >= 0;
    return `<div class="kpi-card">
      <div class="label"><span class="platform-icon" style="background:${p.color}"></span>${p.name}</div>
      <div class="value">${fol !== null ? fol.toLocaleString() : '—'}<span style="font-size:13px;color:var(--muted);font-weight:500"> ${fk ? fk.toLowerCase() : ''}</span></div>
      ${ch !== null ? `<div class="change ${isUp?'up':'down'}">${isUp?'&#9650;':'&#9660;'} ${Math.abs(ch)}% vs prev week</div>` : '<div class="change" style="color:var(--muted)">no data yet</div>'}
    </div>`;
  }).join('');

  destroyCharts();
  document.getElementById("chartsArea").innerHTML = `
    <div class="chart-card"><h3>Followers / Subscribers</h3><div class="chart-wrap"><canvas id="ovFollowers"></canvas></div></div>
    <div class="chart-card"><h3>Weekly Views / Impressions</h3><div class="chart-wrap"><canvas id="ovViews"></canvas></div></div>
    <div class="chart-card"><h3>Weekly Engagements / Interactions</h3><div class="chart-wrap"><canvas id="ovEng"></canvas></div></div>
    <div class="chart-card"><h3>Engagement Rate / CTR %</h3><div class="chart-wrap"><canvas id="ovRate"></canvas></div></div>`;
  const made = [
    multiPlatformChart("ovFollowers", followersKey),
    multiPlatformChart("ovViews", viewsKey),
    multiPlatformChart("ovEng", engKey, 'bar'),
    multiPlatformChart("ovRate", rateKey)
  ].filter(Boolean);
  charts.push(...made);

  // Latest-week summary table
  document.getElementById("tableTitle").textContent = "Latest Week — All Platforms";
  const thead = document.querySelector("#dataTable thead");
  const tbody = document.querySelector("#dataTable tbody");
  thead.innerHTML = `<tr><th>Platform</th><th>Followers</th><th>Views / Impressions</th><th>Engagements</th><th>Eng. Rate / CTR</th></tr>`;
  tbody.innerHTML = Object.entries(DB.platforms).map(([key, p]) => {
    const cell = (mk) => {
      if (!mk) return '—';
      const v = latestVal(p.metrics[mk]);
      return v === null ? '—' : (mk.includes('%') ? v + '%' : v.toLocaleString());
    };
    const rk = rateKey(p);
    const rv = rk ? latestVal(p.metrics[rk]) : null;
    return `<tr>
      <td><span class="platform-icon" style="background:${p.color}"></span>${p.name}</td>
      <td>${cell(followersKey(p))}</td>
      <td>${cell(viewsKey(p))}</td>
      <td>${cell(engKey(p))}</td>
      <td>${rv !== null ? rv + '%' : '—'}</td>
    </tr>`;
  }).join('');
}

/* ---------- boot ---------- */

function render() {
  renderTabs();
  if (activePlatform === 'overview') renderOverview();
  else renderPlatform(activePlatform);
}

document.getElementById("platformTabs").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  activePlatform = tab.dataset.platform;
  render();
});

fetch("data/kpis.json?v=" + Date.now())
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(json => {
    DB = json;
    weekLabels = DB.weeks.map(weekLabel);
    const first = weekLabel(DB.weeks[0]);
    const last = weekLabel(DB.weeks[DB.weeks.length - 1]);
    document.getElementById("subtitle").innerHTML =
      `Weekly social media KPIs &middot; ${first} to ${last} &middot; last updated ${DB.updated}`;
    render();
  })
  .catch(err => {
    document.getElementById("subtitle").textContent = "Could not load data/kpis.json — " + err.message;
  });
</script>
</body>
</html>
