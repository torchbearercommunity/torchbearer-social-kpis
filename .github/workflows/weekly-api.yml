# Collects every platform that has an API, with no computer or browser involved.
# Bluesky works with zero setup. YouTube, Facebook, Instagram and Threads join in
# as soon as their keys are added under Settings -> Secrets and variables ->
# Actions (names match .env.example; setup steps in docs/api-setup.md).
# X, LinkedIn and Substack have no usable API and stay on the browser run, which
# fills in whatever this job could not (preflight puts it in RETRY mode).
name: Weekly API collection

on:
  schedule:
    - cron: "17 12 * * 1" # Mondays 12:17 UTC, early morning US Central
  workflow_dispatch:
    inputs:
      week:
        description: "Monday of the week to collect (YYYY-MM-DD). Blank = last completed week."
        required: false

permissions:
  contents: write

concurrency: weekly-api

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect via APIs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || 'UCo1kAWa39iW5DPIHk__qvXQ' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$WEEK" ]; then node scripts/fetch-api.mjs --week "$WEEK" --apply
          else node scripts/fetch-api.mjs --apply; fi
      - name: Commit and publish
        env:
          WEEK: ${{ inputs.week }}
        run: |
          if git diff --quiet -- data index.html; then echo "Nothing new collected."; exit 0; fi
          git config user.name "tbc-kpi-bot"
          git config user.email "tbc-kpi-bot@users.noreply.github.com"
          git add data/kpi-history.json data/summary.json index.html
          git commit -m "API collection, run of $(date -u +%F)${WEEK:+ for week $WEEK}"
          git pull --rebase
          git push

